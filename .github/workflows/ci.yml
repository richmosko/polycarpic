name: ci

# POLY-6 / POLY-31, ruling scripts/cairn/design/test-boundary-ci.md @ 615b94e section (c).
# One job, id+name `cairn` -- that is the required-check name registered on `main`.
# No workflow-level `on.*.paths:` filter: a required check whose workflow never
# triggers stays "Expected" and blocks the merge forever. The filter lives in the
# `changes` step below instead, and every later step is gated on its output.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cairn:
    name: cairn
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect path changes
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          # Fail closed: if the diff itself errors, `set -e` aborts this step and
          # the job goes red -- it must never fall through to a silent `run=false`.
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          PATTERN='^(scripts/cairn/|\.claude/|process/|tests/workflow/|\.github/workflows/|\.githooks/|docs/DESIGN/)'
          EXCLUDE='^process/cairn/(issues|milestones|majors|archive)/'

          # Addendum 1 (POLY-39 §0.8): skip only when the tree being checked
          # differs from a tree that already went green in tracker paths only.
          # Any gh/API/git failure here takes no skip and falls through to the
          # plain diff test below -- this block may only ever add a `run=false`.
          rc=0; ANCHOR="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&status=success&branch=$HEAD_REF&per_page=1" --jq '.workflow_runs[0].head_sha // empty')" || rc=$?
          if [ "$rc" -ne 0 ]; then
            ANCHOR=""
          fi
          ANCESTRY_OK=false
          if [ -n "$ANCHOR" ] \
             && git cat-file -e "$ANCHOR" 2>/dev/null \
             && git merge-base --is-ancestor "$ANCHOR" "$PR_HEAD" 2>/dev/null \
             && git merge-base --is-ancestor "$BASE_SHA" "$ANCHOR" 2>/dev/null; then
            ANCESTRY_OK=true
          fi
          SKIP=false
          if [ "$ANCESTRY_OK" = "true" ]; then
            if ANCHOR_DIFF="$(git diff --name-only "$ANCHOR" "$PR_HEAD")"; then
              rc=0; ANCHOR_RELEVANT="$(grep -vE "$EXCLUDE" <<<"$ANCHOR_DIFF")" || rc=$?
              if [ "$rc" -le 1 ] && [ -z "$ANCHOR_RELEVANT" ]; then
                SKIP=true
              fi
            fi
          fi

          if [ "$SKIP" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            rc=0; RELEVANT="$(grep -vE "$EXCLUDE" <<<"$CHANGED")" || rc=$?
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi   # 1 = every line excluded; >1 = grep error
            if grep -qE "$PATTERN" <<<"$RELEVANT"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Run cairn Python suite
        if: steps.changes.outputs.run == 'true'
        env:
          CAIRN_TEST_RUNS_FILE: ${{ runner.temp }}/test-runs.jsonl
        run: python3 scripts/cairn/run_tests.py

      - name: Run JS suite
        if: steps.changes.outputs.run == 'true'
        # POLY-8: drop this exclusion once token-chart-logic.test.js skips cleanly
        # without node_modules present (two known local failures otherwise).
        shell: bash
        run: |
          set -euo pipefail
          node --test $(find scripts/cairn/tests/js -name '*.test.js' ! -name 'token-chart-logic.test.js')
