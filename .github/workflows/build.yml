name: build

# POLY-96 stage 2, ruling process/cairn/reviews/POLY-96/ruling.md section 4 (INFRA 4.4, SECURITY C-80..C-83).
# Build once on main: push by digest, scan that digest, then SBOM and provenance. Nothing is signed unless Trivy passed.
# Every job is pinned to refs/heads/main; no cache is restored anywhere in this file (S96-20).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/richmosko/polycarpic

jobs:
  build:
    name: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest (no cache)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          no-cache: true
          pull: true
          provenance: false
          sbom: false

      - name: Install Trivy
        run: bash infra/ci/install-trivy.sh

      - name: Trivy scan of the pushed digest (fails before anything is signed)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash infra/ci/image.sh scan "${IMAGE}@${DIGEST}"

      - name: CycloneDX SBOM of the pushed digest
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash infra/ci/image.sh sbom "${IMAGE}@${DIGEST}"

      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "$DIGEST" > digest.txt
          echo "digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.sha }}
          path: |
            digest.txt
            sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  weekly-scan:
    name: weekly-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: bash infra/ci/install-trivy.sh

      - name: Scan the newest main digest, scan only (no rebuild, no push)
        env:
          GH_TOKEN: ${{ github.token }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r RUN SHA < <(gh run list --workflow build.yml --branch main --status success --event push --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          gh run download "$RUN" -n "image-${SHA}"
          DIGEST="$(cat digest.txt)"
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "weekly scan of ${DIGEST} (commit ${SHA})" >> "$GITHUB_STEP_SUMMARY"
          bash infra/ci/image.sh scan "${IMAGE}@${DIGEST}"
