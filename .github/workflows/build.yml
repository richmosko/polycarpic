name: build

# POLY-96 stage 2, ruling process/cairn/reviews/POLY-96/ruling.md section 4 (INFRA 4.4, SECURITY C-80..C-83).
# Build once on main: push by digest, scan that digest, then SBOM and provenance. Nothing is signed unless Trivy passed.
# Every job is pinned to refs/heads/main; no cache is restored anywhere in this file (S96-20).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/richmosko/polycarpic
  REGISTRY: ghcr.io/richmosko

jobs:
  siblings:
    name: siblings
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      postgres: ${{ steps.postgres.outputs.digest }}
      tools: ${{ steps.tools.outputs.digest }}
      caddy: ${{ steps.caddy.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install Trivy
        run: bash infra/ci/install-trivy.sh

      - name: Build and push postgres by digest (no cache)
        id: postgres
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/postgres
          file: infra/postgres/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/polycarpic-postgres:sha-${{ github.sha }}-${{ github.run_id }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/richmosko/polycarpic
          no-cache: true
          pull: true
          provenance: false
          sbom: false

      - name: Trivy scan of postgres (fails before anything is signed)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          DIGEST: ${{ steps.postgres.outputs.digest }}
        run: bash infra/ci/image.sh scan "${REGISTRY}/polycarpic-postgres@${DIGEST}"

      - name: Provenance attestation of postgres
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/polycarpic-postgres
          subject-digest: ${{ steps.postgres.outputs.digest }}
          push-to-registry: true

      - name: Build and push tools by digest (no cache)
        id: tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/backup
          file: infra/backup/tools.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/polycarpic-tools:sha-${{ github.sha }}-${{ github.run_id }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/richmosko/polycarpic
          no-cache: true
          pull: true
          provenance: false
          sbom: false

      - name: Trivy scan of tools (fails before anything is signed)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          DIGEST: ${{ steps.tools.outputs.digest }}
        run: bash infra/ci/image.sh scan "${REGISTRY}/polycarpic-tools@${DIGEST}"

      - name: Provenance attestation of tools
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/polycarpic-tools
          subject-digest: ${{ steps.tools.outputs.digest }}
          push-to-registry: true

      - name: Build and push caddy by digest (no cache)
        id: caddy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/caddy
          file: infra/caddy/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/polycarpic-caddy:sha-${{ github.sha }}-${{ github.run_id }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/richmosko/polycarpic
          no-cache: true
          pull: true
          provenance: false
          sbom: false

      - name: Trivy scan of caddy (fails before anything is signed)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          DIGEST: ${{ steps.caddy.outputs.digest }}
        run: bash infra/ci/image.sh scan "${REGISTRY}/polycarpic-caddy@${DIGEST}"

      - name: Provenance attestation of caddy
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/polycarpic-caddy
          subject-digest: ${{ steps.caddy.outputs.digest }}
          push-to-registry: true

  release-lint:
    name: release-lint
    needs: siblings
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install pnpm
        run: npm i -g --allow-scripts=pnpm pnpm@12.18.0

      - name: Install (lockfile frozen, lifecycle scripts blocked)
        run: pnpm install --frozen-lockfile

      - name: Write the release's sibling image references
        env:
          POSTGRES: ${{ needs.siblings.outputs.postgres }}
          TOOLS: ${{ needs.siblings.outputs.tools }}
          CADDY: ${{ needs.siblings.outputs.caddy }}
        run: bash infra/ci/images-env.sh "$POSTGRES" "$TOOLS" "$CADDY"

      - name: Compose-policy lint on the release's own images (C-70)
        env:
          POLY_BIND_ADDR: 192.0.2.1
        run: |
          set -euo pipefail
          set -a; . infra/release/images.env; set +a
          node infra/lint/compose-policy.mjs --root .

  build:
    name: build
    needs: [siblings, release-lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Write the release's sibling image references (the app's attestation covers them)
        env:
          POSTGRES: ${{ needs.siblings.outputs.postgres }}
          TOOLS: ${{ needs.siblings.outputs.tools }}
          CADDY: ${{ needs.siblings.outputs.caddy }}
        run: bash infra/ci/images-env.sh "$POSTGRES" "$TOOLS" "$CADDY"

      - name: Build and push by digest (no cache)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ github.run_id }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          no-cache: true
          pull: true
          provenance: false
          sbom: false

      - name: Built-image check of the pushed digest (no package manager, non-root)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash infra/ci/image.sh check "${IMAGE}@${DIGEST}"

      - name: Install Trivy
        run: bash infra/ci/install-trivy.sh

      - name: Trivy scan of the pushed digest (fails before anything is signed)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash infra/ci/image.sh scan "${IMAGE}@${DIGEST}"

      - name: CycloneDX SBOM of the pushed digest
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash infra/ci/image.sh sbom "${IMAGE}@${DIGEST}"

      - name: Provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "$DIGEST" > digest.txt
          echo "digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.sha }}
          path: |
            digest.txt
            sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  release-scan:
    name: release-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: bash infra/ci/install-trivy.sh

      - name: Scan the digest of the newest v1.* Release (scan only; prod is frozen at its tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("v1."))][0].tagName // empty')"
          ONLY=""
          if [ -z "$TAG" ]; then
            # no v1.* Release yet: the Caddy of the highest-n edge-* Release is what is running (R9, S25)
            N="$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | test("^edge-(0|[1-9][0-9]*)$")) | .tagName | ltrimstr("edge-") | tonumber] | max // empty')"
            if [ -z "$N" ]; then echo "no v1.* or edge-* Release yet: nothing to scan" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            TAG="edge-${N}"
            ONLY="caddy"
          fi
          DIGEST="$(gh release view "$TAG" --json body --jq .body | sed -n 's/^digest: //p' | head -n1)"
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "scan of ${TAG}: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          status=0
          if [ -z "$ONLY" ]; then bash infra/ci/image.sh scan "${IMAGE}@${DIGEST}" || status=1; fi
          # the three siblings frozen with that Release: images.env is read out of the app image (created, never started)
          cid="$(docker create "${IMAGE}@${DIGEST}")"
          docker cp "${cid}:/app/infra/release/images.env" images.env || status=1
          docker rm "$cid" > /dev/null
          if [ ! -f images.env ]; then echo "release has no infra/release/images.env" >&2; exit 1; fi
          seen=""
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" =~ ^POLY_(POSTGRES|TOOLS|CADDY)_IMAGE=ghcr\.io/richmosko/polycarpic-(postgres|tools|caddy)@(sha256:[0-9a-f]{64})$ ]] \
              && [ "${BASH_REMATCH[1],,}" = "${BASH_REMATCH[2]}" ] && [[ " $seen " != *" ${BASH_REMATCH[2]} "* ]]; then
              seen="$seen ${BASH_REMATCH[2]}"
              if [ -z "$ONLY" ] || [ "$ONLY" = "${BASH_REMATCH[2]}" ]; then
                bash infra/ci/image.sh scan "ghcr.io/richmosko/polycarpic-${BASH_REMATCH[2]}@${BASH_REMATCH[3]}" || status=1
              fi
            else
              echo "images.env: a line is not in the fixed grammar" >&2; status=1
            fi
          done < images.env
          read -r -a seen_names <<< "$seen"
          [ "${#seen_names[@]}" = 3 ] || { echo "images.env: not exactly postgres, tools and caddy" >&2; status=1; }
          exit "$status"
