name: release

# POLY-96 stage 3, ruling process/cairn/reviews/POLY-96/ruling.md section 5 (INFRA 4.4, SECURITY C-83).
# Records the digest build.yml already built for the tagged commit. It never builds: no build, push or install
# step and no write scope on packages. A manual run is a dry run: `publish` cannot start from it.

on:
  push:
    tags: ["v1.*"]
  workflow_dispatch:
    inputs:
      commit:
        description: "40-hex commit to dry-run the lookup for"
        required: true

permissions: {}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      attestations: read
      actions: read
    outputs:
      digest: ${{ steps.lookup.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Tag checks (signed, annotated, on main)
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          SIGNERS: ${{ vars.RELEASE_SIGNERS }}
        run: |
          set -euo pipefail
          [ -n "$SIGNERS" ] || { echo "RELEASE_SIGNERS variable is empty: refusing" >&2; exit 1; }
          [ "$(git cat-file -t "refs/tags/${TAG}")" = "tag" ] || { echo "${TAG} is not an annotated tag" >&2; exit 1; }
          printf '%s\n' "$SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git verify-tag "$TAG"
          git merge-base --is-ancestor "$(git rev-list -n1 "refs/tags/${TAG}")" origin/main

      - name: Log in to GHCR (read)
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Look up and verify the digest built for the commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          RELEASE_OUT: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then COMMIT="$(git rev-list -n1 "refs/tags/${TAG}")"; else COMMIT="$INPUT_COMMIT"; fi
          bash infra/ci/release-lookup.sh "$COMMIT" | tee "$RUNNER_TEMP/lookup.out"
          tail -n1 "$RUNNER_TEMP/lookup.out" | sed 's/^digest: /digest=/' >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/lookup.out" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the SBOM for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/release/sbom.cdx.json
          if-no-files-found: warn

  publish:
    name: publish
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Fetch the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: sbom

      - name: Publish the Release (refuses an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.verify.outputs.digest }}
        run: |
          set -euo pipefail
          echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release ${TAG} already exists: refusing" >&2; exit 1; fi
          gh release create "$TAG" sbom/sbom.cdx.json --verify-tag --title "$TAG" --notes "digest: ${DIGEST}"
