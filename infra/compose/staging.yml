# polycarpic-staging (INFRA §2.2): its own database, own secret directory, no backup or upload network.
name: polycarpic-staging

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  ulimits: {core: 0}

x-app-image: &app-image ${POLY_APP_IMAGE:?}

services:
  postgres:
    <<: *hardened
    image: ${POLY_POSTGRES_IMAGE:?}
    user: "999:999"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
    secrets:
      - {source: db_superuser_password__postgres, target: db_superuser_password}
    networks: [default]
    mem_limit: 1g
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=999,gid=999,mode=0755
    volumes:
      - /srv/polycarpic/pg-staging:/var/lib/postgresql/data
      - ../postgres/postgresql.staging.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/pg_hba.staging.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h /var/run/postgresql"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    <<: *hardened
    image: *app-image
    user: "10101:10101"
    env_file: [/etc/polycarpic/staging-host.env]
    environment:
      APP_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: polycarpic
      DATABASE_USER: poly_app
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_app
    secrets:
      - {source: db_password_app__web, target: db_password_app}
      - {source: plaid_secret__web, target: plaid_secret}
    networks:
      default: {}
      edge-staging:
        aliases: [staging-web]
    mem_limit: 384m
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s

  auth:
    <<: *hardened
    image: *app-image
    user: "10107:10107"
    command: ["auth"]
    env_file: [/etc/polycarpic/staging-host.env]
    environment:
      APP_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: polycarpic
      DATABASE_USER: poly_auth
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_auth
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      AUTH_PUBLIC_PORT: "3000"
    secrets:
      - {source: db_password_auth__auth, target: db_password_auth}
      - {source: auth_secret__auth, target: auth_secret}
      - {source: resend_api_key__auth, target: resend_api_key}
    networks:
      default: {}
      edge-staging:
        aliases: [staging-auth]
    mem_limit: 192m
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/ok',{headers:{'x-forwarded-for':'127.0.0.1'}}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s

  worker:
    <<: *hardened
    image: *app-image
    user: "10102:10102"
    env_file: [/etc/polycarpic/staging-host.env]
    environment:
      APP_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: polycarpic
      DATABASE_USER: poly_worker
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_worker
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
    secrets:
      - {source: db_password_worker__worker, target: db_password_worker}
      - {source: credential_keyring__worker, target: credential_keyring}
      - {source: resend_api_key__worker, target: resend_api_key}
    networks: [default]
    mem_limit: 384m
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s

  migrate:
    <<: *hardened
    image: *app-image
    user: "10103:10103"
    restart: "no"
    profiles: [migrate]
    env_file: [/etc/polycarpic/staging-host.env]
    environment:
      APP_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: polycarpic
      DATABASE_USER: poly_migrator
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_migrator
    secrets:
      - {source: db_password_migrator__migrate, target: db_password_migrator}
    networks: [default]
    mem_limit: 512m
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s

  operator:
    <<: *hardened
    image: *app-image
    user: "10106:10106"
    restart: "no"
    profiles: [operator]
    logging: {driver: "none"}
    entrypoint: ["/app/bin/polycarpic", "cli"]
    env_file: [/etc/polycarpic/staging-host.env]
    environment:
      APP_ENV: staging
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: polycarpic
      DATABASE_USER: poly_operator
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD_FILE: /run/secrets/db_password_operator
    secrets:
      - {source: db_password_operator__operator, target: db_password_operator}
    networks: [default]
    mem_limit: 256m
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s

networks:
  default:
    name: polycarpic-staging_default
    ipam:
      config: [{subnet: 10.202.1.0/24}]
  edge-staging:
    name: polycarpic-edge-staging
    external: true

secrets:
  db_superuser_password__postgres: {file: /etc/polycarpic/staging-secrets/postgres/db_superuser_password}
  db_password_app__web: {file: /etc/polycarpic/staging-secrets/web/db_password_app}
  plaid_secret__web: {file: /etc/polycarpic/staging-secrets/web/plaid_secret}
  db_password_auth__auth: {file: /etc/polycarpic/staging-secrets/auth/db_password_auth}
  auth_secret__auth: {file: /etc/polycarpic/staging-secrets/auth/auth_secret}
  resend_api_key__auth: {file: /etc/polycarpic/staging-secrets/auth/resend_api_key}
  db_password_worker__worker: {file: /etc/polycarpic/staging-secrets/worker/db_password_worker}
  credential_keyring__worker: {file: /etc/polycarpic/staging-secrets/worker/credential_keyring}
  resend_api_key__worker: {file: /etc/polycarpic/staging-secrets/worker/resend_api_key}
  db_password_migrator__migrate: {file: /etc/polycarpic/staging-secrets/migrate/db_password_migrator}
  db_password_operator__operator: {file: /etc/polycarpic/staging-secrets/operator/db_password_operator}
