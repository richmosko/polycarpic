# The whole config_file for prod postgres (INFRA §2.2). Passed as `postgres -c config_file=...`; nothing else sets a value.
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
shared_buffers = 768MB
password_encryption = scram-sha-256
allow_alter_system = off

# C-75: no bind parameters in the log
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_statement = 'ddl'

# C-79
log_connections = on
max_replication_slots = 2
max_wal_senders = 3
max_slot_wal_keep_size = 2GB

archive_mode = on
archive_timeout = 300
archive_command = '/usr/local/bin/archive-wal.sh %p %f'
