<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe — Login</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body>
<div style="display:grid; grid-template-columns:1fr 1fr; min-height:100vh; background:#1a1a1a; color:#eee;">
  <div style="display:flex; flex-direction:column; justify-content:center; padding:48px;">
    <div class="wf-box-label" style="color:#8f8;">[brand mark]</div>
    <div class="wf-placeholder-text w80" style="background:#444;"></div>
    <div class="wf-placeholder-text w60" style="background:#444;"></div>
  </div>
  <div style="display:flex; align-items:center; justify-content:center;">
    <div class="wf-box" style="background:#222; border-color:#555; width:320px; color:#eee;">
      <span class="wf-box-label" style="color:#aaa;">Sign in</span>
      <div class="wf-placeholder-text" style="background:#444;"></div>
      <span class="wf-chip" style="border-color:#8f8; color:#8f8;">Continue</span>
      <div style="margin:12px 0; color:#666; font-size:11px;">— or —</div>
      <div class="wf-row" style="border:none;"><span class="wf-chip">Google</span></div>
      <div class="wf-row" style="border:none;"><span class="wf-chip">Apple</span></div>
      <div class="wf-row" style="border:none;"><span class="wf-chip">GitHub</span></div>
    </div>
  </div>
</div>
</body>
</html>
