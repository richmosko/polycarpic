<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wireframe — Home (entity picker)</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body>
<div class="wf-shell">
  <div class="wf-topbar">
    <strong>polycarpic</strong>
    <span style="margin-left:auto;" class="wf-chip">Sign out</span>
  </div>
  <div class="wf-content" style="padding:32px;">
    <h1>Your entities</h1>
    <p class="wf-note">Single-entity users skip this screen entirely and land on their Dashboard. Shown here: a multi-entity (household) user.</p>
    <div class="wf-grid cols-3">
      <div class="wf-box">
        <span class="wf-box-label">Person</span>
        <div>Mosko</div>
        <span class="wf-chip">Owner</span>
        <div class="wf-placeholder-text w60" style="margin-top:8px;"></div>
      </div>
      <div class="wf-box">
        <span class="wf-box-label">Household</span>
        <div>The Moskos</div>
        <span class="wf-chip">Owner</span>
        <div class="wf-placeholder-text w60" style="margin-top:8px;"></div>
      </div>
      <div class="wf-box">
        <span class="wf-box-label">Trust</span>
        <div>Family Trust</div>
        <span class="wf-chip">Manager</span>
        <div class="wf-placeholder-text w60" style="margin-top:8px;"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
