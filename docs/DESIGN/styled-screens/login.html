<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Styled screen — Login (split screen login page)</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../screen.css">
</head>
<body>
<!-- Split screen login page — the Principal's named pattern. Form-pane
     content list is exact per direction: logo, "Welcome back" + subtext,
     OAuth button, divider, email, password (+ forgot-password + reveal),
     primary button, sign-up line, legal footer. References:
     useorigin.com/authentication/login (no capture, splash loader) and
     temp/design-refs/split-login-example.png (captured). Form pane is
     theme-aware (this is the light-mode render); visual pane always
     carries the brand identity regardless of theme. -->
<div class="auth-shell">
  <div class="auth-form-pane">
    <div class="auth-logo"><span class="brand-icon"><svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.61 12.23 C11.88 9.39 12.74 6.15 15.45 4.12 C17.07 2.91 18.69 2.23 20.04 1.55 C19.55 5.12 18.20 9.53 13.42 12.23"/><path d="M10.50 13.66 C10.74 11.07 8.47 8.36 3.88 6.96 C5.12 10.26 7.07 13.18 10.50 13.66 Z"/><path d="M10.50 13.66 C11.39 14.74 11.66 15.88 11.58 17.09 L11.61 21.23"/><path d="M12.61 12.23 C12.07 13.99 11.61 15.61 11.58 17.09"/><path d="M8.74 22.36 C10.04 21.28 13.28 21.01 14.77 22.42"/></svg></span><span>Polycarpic</span></div>
    <div class="auth-form-inner">
      <div class="auth-title">Welcome back</div>
      <p class="auth-subtitle">Sign in to your account</p>

      <div class="auth-oauth-row">
        <button class="btn btn-outline">Continue with Google</button>
      </div>
      <div class="auth-divider">or</div>

      <div class="auth-field">
        <label>Email</label>
        <input class="input" type="email" placeholder="you@example.com">
      </div>
      <div class="auth-field">
        <div class="field-label-row">
          <label>Password</label>
          <a class="forgot-link" href="#">Forgot password?</a>
        </div>
        <div class="input-with-icon">
          <input class="input" type="password" value="••••••••••••">
          <button class="reveal-icon" aria-label="Show password"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span></button>
        </div>
      </div>

      <button class="btn btn-default auth-submit">Sign in</button>

      <p class="auth-signup-line">Don't have an account? <a href="#">Sign up</a></p>

      <p class="auth-legal-footer">By signing in you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
    </div>
  </div>

  <div class="auth-visual-pane">
    <div class="visual-caption">One ledger. Every entity. Self-hosted.</div>
  </div>
</div>
</body>
</html>
